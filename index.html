<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mine Blocks /summon Generator</title>
<style>
    @font-face {
        font-family: 'Rainy Hearts';
        src: url('rainyhearts.ttf') format('truetype');
    }
    
    body {
        background-color: #1e1e1e;
        color: #ffffff;
        font-family: 'Rainy Hearts', monospace, sans-serif;
        font-size: 18px;
        margin: 0;
        line-height: 1.4;
    }

    .mc-ui {
        background-color: #2b2b2b;
        border: 4px solid;
        border-color: #5a5a5a #111111 #111111 #5a5a5a;
        color: #ffffff;
        padding: 16px;
    }
    
    .mc-ui-inset {
        background-color: #1e1e1e;
        border: 4px solid;
        border-color: #111111 #5a5a5a #5a5a5a #111111;
    }

    .mc-btn {
        background-color: #404040;
        border: 4px solid;
        border-color: #7a7a7a #111111 #111111 #7a7a7a;
        color: #ffffff;
        padding: 8px 16px;
        font-family: 'Rainy Hearts', sans-serif;
        font-size: 18px;
        cursor: pointer;
        text-transform: uppercase;
        text-shadow: 2px 2px 0 #111111;
        transition: transform 0.05s, border-color 0.05s;
    }
    .mc-btn:active {
        border-color: #111111 #7a7a7a #7a7a7a #111111;
        transform: translate(2px, 2px);
    }

    input[type="text"], input[type="number"], select {
        background-color: #111111;
        color: #ffffff;
        border: 2px solid;
        border-color: #000000 #5a5a5a #5a5a5a #000000;
        padding: 8px;
        font-family: 'Rainy Hearts', sans-serif;
        font-size: 16px;
        margin-top: 4px;
        width: 100%;
        box-sizing: border-box;
    }
    
    input[type="checkbox"] {
        width: 20px;
        height: 20px;
        vertical-align: middle;
        margin-right: 8px;
        accent-color: #5a5a5a;
        cursor: pointer;
    }

    .main-container {
        display: flex;
        flex-direction: column;
        max-width: 1100px;
        margin: auto;
    }
    @media (min-width: 768px) {
        .main-container {
            flex-direction: row;
        }
    }

    .left-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        height: fit-content;
    }
    .right-col {
        flex: 2;
        max-height: 90vh;
        overflow-y: auto;
    }

    .input-row {
        display: flex;
        gap: 20px;
        width: 100%;
        margin-bottom: 15px;
    }
    .input-group {
        flex: 1;
        display: flex;
        flex-direction: column;
    }
    .checkboxes-row {
        align-items: center;
        margin-top: -5px;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid #111;
        flex-wrap: wrap;
    }

    .preview-box {
        width: 325px;
        height: 377px;
        display: flex;
        justify-content: center;
        align-items: flex-end; /* Alinea los elementos al fondo */
        background-color: #1e1e1e;
        background-image: linear-gradient(45deg, #181818 25%, transparent 25%, transparent 75%, #181818 75%, #181818), linear-gradient(45deg, #181818 25%, transparent 25%, transparent 75%, #181818 75%, #181818);
        background-size: 20px 20px;
        background-position: 0 0, 10px 10px;
        position: relative; /* Base para las capas superpuestas */
        padding-bottom: 20px; /* Margen inferior visual */
        box-sizing: border-box;
    }
    .preview-box img.base-mob {
        width: 100%;  
        height: 100%; 
        object-fit: contain; 
        object-position: bottom center; /* Fija la imagen al suelo del contenedor */
        image-rendering: pixelated;
        position: relative;
        z-index: 1;
    }
    /* 1. Modificamos la clase base para quitar el 100% de tamaño forzado */
    .preview-overlay {
        position: absolute;
        image-rendering: pixelated;
        pointer-events: none; /* Evita bloquear clics */
        /* Centramos horizontalmente por defecto para facilitar el trabajo */
        left: 50%;
        transform: translateX(-50%);
    }
    
    /* 2. Aquí están los controles manuales para cada pieza */
    /* MODIFICA ESTOS NÚMEROS HASTA QUE ENCAJEN CON TU ZOMBIE/SPAWNSKIN */
    
    #preview-layer-helmet { 
        z-index: 5; 
        width: 110px;       /* Tamaño de la imagen del casco */
        height: 110px;
        bottom: 220px;      /* Altura a la que flota (desde el suelo del cuadro) */
        /* margin-left: 5px;   Descomenta y cambia esto si necesitas moverlo a la izquierda/derecha */
    }

    #preview-layer-chestplate { 
        z-index: 4; 
        width: 130px; 
        height: 130px;
        bottom: 120px; 
    }

    #preview-layer-leggings { 
        z-index: 3; 
        width: 120px; 
        height: 120px;
        bottom: 60px; 
    }

    #preview-layer-boots { 
        z-index: 2; 
        width: 130px; 
        height: 90px;
        bottom: 20px;       /* 20px es justo al ras del padding de la caja */
    }

    #preview-layer-fire { 
        z-index: 6; 
        width: 180px; 
        height: 180px;
        bottom: 20px; 
        opacity: 0.85;      /* Transparencia opcional para que se vea el mob quemándose */
    }
    
    /* Control del orden de las capas (z-index) */
    #preview-layer-boots { z-index: 2; }
    #preview-layer-leggings { z-index: 3; }
    #preview-layer-chestplate { z-index: 4; }
    #preview-layer-helmet { z-index: 5; }
    #preview-layer-fire { z-index: 6; }

    .modal-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-content {
        width: 850px;
        max-width: 95%;
        height: 580px;
        display: flex;
        flex-direction: column;
    }
    
    .tabs {
        display: flex;
        gap: 0px;
        margin-bottom: -4px;
        flex-wrap: wrap;
    }
    .tab {
        background-color: #1e1e1e;
        border: 4px solid;
        border-color: #5a5a5a #111111 #111111 #5a5a5a;
        border-bottom: none;
        padding: 8px 11px;
        cursor: pointer;
        z-index: 1;
        color: #aaaaaa;
        font-size: 18px;
    }
    .tab.active {
        background-color: #2b2b2b;
        border-bottom: 4px solid #2b2b2b;
        color: #ffffff;
        text-shadow: none;
    }
    
    .inventory-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0;
        padding: 20px;
        flex-grow: 1;
        align-content: start;
        overflow-y: auto;
    }
    
    .inv-card {
        background-color: #333333;
        border: 2px solid;
        border-color: #5a5a5a #111111 #111111 #5a5a5a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px 6px;
        cursor: pointer;
        transition: transform 0.1s, border-color 0.1s, background-color 0.1s;
    }
    .inv-card:hover {
        background-color: #444444;
        border-color: #aaaaaa #111111 #111111 #aaaaaa;
        transform: translateY(-3px);
    }
    .inv-card img {
        width: 77px;
        height: 124px;
        object-fit: contain;
        image-rendering: pixelated;
        margin-bottom: 10px;
    }
    .inv-card-name {
        font-size: 14px;
        color: #ffffff;
        text-align: center;
        word-break: break-word;
        text-transform: capitalize;
        line-height: 1.2;
    }

    .items-grid {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 0px;
        padding: 20px;
        flex-grow: 1;
        align-content: start;
        overflow-y: auto;
    }
    .item-slot {
        background-color: #333333;
        border: 2px solid;
        border-color: #5a5a5a #111111 #111111 #5a5a5a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 64px;
        cursor: pointer;
    }
    .item-slot:hover {
        background-color: #5a5a5a;
    }
    .item-slot img {
        width: 48px;
        height: 48px;
        image-rendering: pixelated;
        object-fit: contain;
    }

    .command-output {
        margin-top: 25px;
        background: #000000;
        color: #55ff55;
        padding: 15px;
        border: 4px solid #111111;
        font-family: monospace;
        word-wrap: break-word;
        font-size: 16px;
    }
    
    .drop-row {
        display: flex;
        gap: 10px;
        align-items: center;
        background-color: #1e1e1e;
        border: 2px solid #111111;
    }

    .drop-item-selector {
        width: 48px;
        height: 48px;
        background-color: #333333;
        border: 2px solid;
        border-color: #5a5a5a #111111 #111111 #5a5a5a;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
        flex-shrink: 0; 
    }
    .drop-item-selector:hover {
        background-color: #444444;
    }
    .drop-item-selector img {
        width: 32px;
        height: 32px;
        image-rendering: pixelated;
    }
    .drop-item-selector span {
        color: #fff;
    }

    .drop-row input { margin: 0; flex: 1; }
    .drop-row button { margin: 0; padding: 6px 12px; }
    
    .conditional-group { 
        display: none; 
        margin-bottom: 15px; 
        padding: 15px; 
        background-color: #1e1e1e;
        border: 2px solid #111111;
    }
    
    label { display: block; margin-top: 5px; font-weight: bold;}
    .inline-label { display: inline-flex; align-items: center; margin-top: 0; font-weight: normal; cursor: pointer;}
    h2 { margin-top: 0; text-transform: uppercase; font-size: 24px;}
    h3 { margin-top: 0; font-size: 20px; color: #ddd;}

    .armor-container {
        display: flex;
        flex-direction: row;
        gap: 4px;
        margin-top: 15px;
        width: fit-content;
    }
    .custom-dropdown {
        position: relative;
        width: 64px;
        height: 64px;
        user-select: none;
    }
    .dropdown-trigger {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        position: relative;
        background-color: #333333;
        border: 2px solid;
        border-color: #5a5a5a #111111 #111111 #5a5a5a;
    }
    .dropdown-trigger:hover {
        background-color: #444444;
    }
    .dropdown-trigger img {
        width: 48px;
        height: 48px;
        image-rendering: pixelated;
    }
    .dropdown-placeholder {
        font-size: 12px;
        color: #aaaaaa;
        text-align: center;
        line-height: 1.1;
    }
    
    .dropdown-options {
        display: none;
        position: absolute;
        top: 68px;
        left: 0;
        background: #2b2b2b;
        border: 4px solid;
        border-color: #5a5a5a #111111 #111111 #5a5a5a;
        z-index: 50;
        flex-direction: column;
        width: max-content;
        padding: 4px;
        gap: 4px;
    }
    .custom-dropdown.open .dropdown-options {
        display: flex;
    }
    .dropdown-option {
        width: 56px;
        height: 56px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        background-color: #333333;
    }
    .dropdown-option:hover {
        background-color: #5a5a5a;
    }
    .dropdown-option img {
        width: 48px;
        height: 48px;
        image-rendering: pixelated;
    }
    
    .close-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        padding: 6px 12px;
        background-color: #aa0000; 
        border-color: #ff5555 #550000 #550000 #ff5555;
    }
    .close-btn:active {
        border-color: #550000 #ff5555 #ff5555 #550000;
    }
</style>
</head>
<body>

<div class="main-container">
    
    <!-- Left Column: Mob Target -->
    <div class="left-col mc-ui">
        <h2>Mob Target</h2>
        <div class="preview-box mc-ui-inset">
            <img id="mob-preview-img" class="base-mob" src="mobs/pig.png" alt="Preview" onerror="this.style.display='none'">
            
            <!-- Capas de visualización (Armaduras y Fuego) -->
            <img id="preview-layer-boots" class="preview-overlay" src="" style="display:none;" alt="">
            <img id="preview-layer-leggings" class="preview-overlay" src="" style="display:none;" alt="">
            <img id="preview-layer-chestplate" class="preview-overlay" src="" style="display:none;" alt="">
            <img id="preview-layer-helmet" class="preview-overlay" src="" style="display:none;" alt="">
            <img id="preview-layer-fire" class="preview-overlay" src="assets/fire.png" style="display:none;" alt="">
        </div>
        <h2 id="mob-name-display" style="border:none; padding:0; margin:5px 0;">PIG</h2>
        <button class="mc-btn" onclick="openInventory()">Seleccionar Mob</button>
    </div>

    <!-- Right Column: Options -->
    <div class="right-col mc-ui">
        <h2>Atributos & Tags</h2>
        
        <div class="input-row">
            <div class="input-group">
                <label>Custom Name:</label>
                <input type="text" id="inp-name" value="Crystal" placeholder="Crystal" oninput="generateCommand()">
            </div>
            <div class="input-group">
                <label>Health:</label>
                <input type="number" id="inp-health" placeholder="20" oninput="generateCommand()">
            </div>
        </div>
        
        <div class="input-row checkboxes-row">
            <label class="inline-label">
                <input type="checkbox" id="inp-defaultDrops" checked onchange="generateCommand()"> 
                Default Drops
            </label>
            <label class="inline-label">
                <input type="checkbox" id="inp-onFire" onchange="generateCommand()"> 
                On Fire
            </label>
            <label class="inline-label" id="group-charged" style="display: none;">
                <input type="checkbox" id="inp-charged" onchange="generateCommand()"> 
                Charged
            </label>
            <label class="inline-label" id="group-baby" style="display: none;">
                <input type="checkbox" id="inp-baby" onchange="generateCommand()"> 
                Baby
            </label>
            <label class="inline-label" id="group-sheared" style="display: none;">
                <input type="checkbox" id="inp-sheared" onchange="generateCommand()"> 
                Sheared
            </label>
        </div>
        
        <div id="group-holding" class="conditional-group">
            <h3>Holding Item</h3>
            <label>Item ID (ej. diamond_sword):</label>
            <input type="text" id="inp-holding" placeholder="diamond_sword" oninput="generateCommand()">
        </div>
        
        <div id="group-armor" class="conditional-group">
            <label class="inline-label" style="font-weight:bold; font-size:16px;">
                <input type="checkbox" id="inp-armor-enable" onchange="toggleArmorInterface(); generateCommand()"> 
                Equipar Armadura
            </label>
            
            <div id="armor-selectors" class="armor-container" style="display:none;">
                <!-- Helmet -->
                <div class="custom-dropdown" data-slot="helmet" id="dd-helmet">
                    <div class="dropdown-trigger" onclick="toggleDropdown(this)">
                        <span class="dropdown-placeholder">Casco</span>
                        <img src="" style="display:none;" alt="">
                    </div>
                    <div class="dropdown-options">
                        <div class="dropdown-option mc-ui-inset" data-value="" onclick="selectArmorOption(this)"><img src="armors/empty.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="leather_cap" onclick="selectArmorOption(this)"><img src="armors/leather_cap.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="iron_helmet" onclick="selectArmorOption(this)"><img src="armors/iron_helmet.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="gold_helmet" onclick="selectArmorOption(this)"><img src="armors/gold_helmet.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="diamond_helmet" onclick="selectArmorOption(this)"><img src="armors/diamond_helmet.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="dragon_scale_helmet" onclick="selectArmorOption(this)"><img src="armors/dragon_scale_helmet.png" onerror="this.style.display='none'"></div>
                    </div>
                </div>
                <!-- Chestplate -->
                <div class="custom-dropdown" data-slot="chestplate" id="dd-chestplate">
                    <div class="dropdown-trigger" onclick="toggleDropdown(this)">
                        <span class="dropdown-placeholder">Pechera</span>
                        <img src="" style="display:none;" alt="">
                    </div>
                    <div class="dropdown-options">
                        <div class="dropdown-option mc-ui-inset" data-value="" onclick="selectArmorOption(this)"><img src="armors/empty.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="leather_tunic" onclick="selectArmorOption(this)"><img src="armors/leather_tunic.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="iron_chestplate" onclick="selectArmorOption(this)"><img src="armors/iron_chestplate.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="gold_chestplate" onclick="selectArmorOption(this)"><img src="armors/gold_chestplate.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="diamond_chestplate" onclick="selectArmorOption(this)"><img src="armors/diamond_chestplate.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="dragon_scale_chestplate" onclick="selectArmorOption(this)"><img src="armors/dragon_scale_chestplate.png" onerror="this.style.display='none'"></div>
                    </div>
                </div>
                <!-- Leggings -->
                <div class="custom-dropdown" data-slot="leggings" id="dd-leggings">
                    <div class="dropdown-trigger" onclick="toggleDropdown(this)">
                        <span class="dropdown-placeholder">Pantalón</span>
                        <img src="" style="display:none;" alt="">
                    </div>
                    <div class="dropdown-options">
                        <div class="dropdown-option mc-ui-inset" data-value="" onclick="selectArmorOption(this)"><img src="armors/empty.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="leather_pants" onclick="selectArmorOption(this)"><img src="armors/leather_pants.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="iron_leggings" onclick="selectArmorOption(this)"><img src="armors/iron_leggings.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="gold_leggings" onclick="selectArmorOption(this)"><img src="armors/gold_leggings.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="diamond_leggings" onclick="selectArmorOption(this)"><img src="armors/diamond_leggings.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="dragon_scale_leggings" onclick="selectArmorOption(this)"><img src="armors/dragon_scale_leggings.png" onerror="this.style.display='none'"></div>
                    </div>
                </div>
                <!-- Boots -->
                <div class="custom-dropdown" data-slot="boots" id="dd-boots">
                    <div class="dropdown-trigger" onclick="toggleDropdown(this)">
                        <span class="dropdown-placeholder">Botas</span>
                        <img src="" style="display:none;" alt="">
                    </div>
                    <div class="dropdown-options">
                        <div class="dropdown-option mc-ui-inset" data-value="" onclick="selectArmorOption(this)"><img src="armors/empty.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="leather_boots" onclick="selectArmorOption(this)"><img src="armors/leather_boots.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="iron_boots" onclick="selectArmorOption(this)"><img src="armors/iron_boots.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="gold_boots" onclick="selectArmorOption(this)"><img src="armors/gold_boots.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="diamond_boots" onclick="selectArmorOption(this)"><img src="armors/diamond_boots.png" onerror="this.style.display='none'"></div>
                        <div class="dropdown-option mc-ui-inset" data-value="dragon_scale_boots" onclick="selectArmorOption(this)"><img src="armors/dragon_scale_boots.png" onerror="this.style.display='none'"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="group-aggro" class="conditional-group">
            <label>Aggro:</label>
            <select id="inp-aggro" onchange="generateCommand()">
                <option value="neutral">neutral</option>
                <option value="hostile">hostile</option>
                <option value="passive">passive</option>
            </select>
        </div>

        <div id="group-skin" class="conditional-group">
            <label>Skin ID:</label>
            <input type="number" id="inp-skin" placeholder="1" oninput="generateCommand()">
        </div>

        <div id="group-color" class="conditional-group">
            <label>Color:</label>
            <select id="inp-color" onchange="generateCommand()">
                <option value="">(Por defecto)</option>
                <option value="red">red</option><option value="green">green</option>
                <option value="blue">blue</option><option value="cyan">cyan</option>
                <option value="lightblue">lightblue</option><option value="lightgreen">lightgreen</option>
                <option value="magenta">magenta</option><option value="orange">orange</option>
                <option value="pink">pink</option><option value="purple">purple</option>
                <option value="white">white</option><option value="yellow">yellow</option>
                <option value="lightgray">lightgray</option><option value="gray">gray</option>
                <option value="black">black</option>
            </select>
        </div>

        <div style="margin-top: 30px; border-top: 4px solid #111; padding-top: 15px;">
            <h2>Loot Drops</h2>
            <div id="drops-container"></div>
            <button class="mc-btn" onclick="addDrop()">+ Añadir Drop</button>
        </div>

        <!-- Output Display -->
        <div class="command-output" id="output-command">
            /summon pig 1 ~ ~
        </div>
    </div>
</div>

<!-- Modal para Mobs -->
<div id="inv-modal" class="modal-overlay">
    <div class="modal-content mc-ui">
        <h2>Seleccionar Mob</h2>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('Animals', this)">Animals</div>
            <div class="tab" onclick="switchTab('Overworld', this)">Overworld</div>
            <div class="tab" onclick="switchTab('Nether', this)">Nether</div>
            <div class="tab" onclick="switchTab('End', this)">End</div>
        </div>
        <div class="inventory-grid mc-ui-inset" id="inv-grid"></div>
        <div style="text-align: right; margin-top: 15px;">
            <button class="mc-btn" onclick="closeInventory()">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal para Items (Drops) -->
<div id="items-modal" class="modal-overlay">
    <div class="modal-content mc-ui" style="width: 850px; height: 580px; position: relative;">
        
        <button class="mc-btn close-btn" onclick="closeItemInventory()">X</button>

        <h2 style="margin-right: 40px;">Seleccionar Item</h2>
        
        <div class="tabs" id="item-tabs">
            <div class="tab active" onclick="switchItemTab('Blocks', this)">Blocks</div>
            <div class="tab" onclick="switchItemTab('Decorations', this)">Decorations</div>
            <div class="tab" onclick="switchItemTab('Tools', this)">Tools</div>
            <div class="tab" onclick="switchItemTab('Armor', this)">Armor</div>
            <div class="tab" onclick="switchItemTab('Food', this)">Food</div>
            <div class="tab" onclick="switchItemTab('Redstone', this)">Redstone</div>
            <div class="tab" onclick="switchItemTab('Transportation', this)">Transportation</div>
            <div class="tab" onclick="switchItemTab('Brewing', this)">Brewing</div>
            <div class="tab" onclick="switchItemTab('Miscellaneous', this)">Miscellaneous</div>
        </div>

        <div class="items-grid mc-ui-inset" id="items-grid">
            <!-- Rellenado por JS -->
        </div>
        
    </div>
</div>

<script>
    const mobsData = {
        Animals: ['pig', 'cow', 'sheep', 'chicken', 'squid', 'rabbit', 'bat', 'dog', 'wolf', 'mooshroom', 'cowctus'],
        Overworld: ['zombie', 'creeper', 'skeleton', 'spider', 'slime', 'snow_golem', 'spawnskin'],
        Nether: ['zombie_pigman', 'ghast', 'blaze', 'magma_cube', 'nethereye'],
        End: ['enderman', 'ender_dragon']
    };

    const itemsData = {
    "Blocks": [
        "stone", "cobblestone", "stone_brick", "moss_stone", "obsidian", "bedrock", "dirt", "grass", "coarse_dirt",
        "farmland", "mycelium", "gold_soil", "wood", "tree_wood", "wooden_planks", "barrier", "coal_ore", "iron_ore",
        "gold_ore", "diamond_ore", "redstone_ore", "odd_rock_ore", "lapis_ore", "topaz_ore", "iron_block",
        "gold_block", "diamond_ore", "lapis_lazuli_block", "coal_ore", "sand", "sandstone", "clay_block", "brick", "bricks",
        "snow_block", "ice", "frosted_ice", "gravel", "bookshelf", "stairs_cobblestone", "stairs_stone", "stairs_nether_brick", "stairs_brick"
    ],
    "Decorations": [
        "crafting_table", "furnace", "chest", "ender_chest", "composter", "enchantment_table", "anvil", "name_tag", "bed",
        "wooden_door", "iron_door", "bamboo_door", "trap_door", "sign", "sapling", "leaves",
    ],
    "Tools": [
        "wooden_pickaxe", "wooden_shovel", "wooden_axe", "wooden_hoe", "wooden_sword", "", "", "", "",
        "stone_pickaxe", "stone_shovel", "stone_axe", "stone_hoe", "stone_sword", "", "", "", "",
        "iron_pickaxe", "iron_shovel", "iron_axe", "iron_hoe", "iron_sword", "", "", "", "",
        "golden_pickaxe", "golden_shovel", "golden_axe", "golden_hoe", "golden_sword", "", "", "", "",
        "diamond_pickaxe", "diamond_shovel", "diamond_axe", "diamond_hoe", "diamond_sword", "", "", "", "",
    ],
    "Armor": [
        "leather_cap", "iron_helmet", "gold_helmet", "diamond_helmet", "dragon_scale_helmet", "", "", "", "",
        "leather_tunic", "iron_chestplate", "gold_chestplate", "diamond_chestplate", "dragon_scale_chestplate", "", "", "", "",
        "leather_pants", "iron_leggings", "gold_leggings", "diamond_leggings", "dragon_scale_leggings", "", "", "", "",
        "leather_boots", "iron_boots", "gold_boots", "diamond_boots", "dragon_scale_boots", "", "", "", "",
    ],
    "Food": [
        "apple", "bread"
    ],
    "Redstone": [
        "redstone", "piston"
    ],
    "Transportation": [
        "minecart", "rail"
    ],
    "Brewing": [
        "brewing_stand", "potion"
    ],
    "Miscellaneous": [
        "diamond", "stick"
    ]
};

    let identifiers = [];
    Object.values(itemsData).forEach(arr => {
        identifiers = identifiers.concat(arr.filter(id => id !== ""));
    });

    let selectedMob = 'pig';
    let armorState = { helmet: "", chestplate: "", leggings: "", boots: "" };
    
    let activeDropRow = null;
    let dropRowCounter = 0;

   function init() {
    switchTab('Animals', document.querySelector('.tab'));
    updateVisibility();
    
    switchItemTab('Blocks', document.querySelector('#item-tabs .tab'));
    
    generateCommand();
    
    document.addEventListener('click', function(event) {
        const dropdowns = document.querySelectorAll('.custom-dropdown');
        dropdowns.forEach(dd => {
            if (!dd.contains(event.target)) {
                dd.classList.remove('open');
            }
        });
    });
}

    function openInventory() {
        document.getElementById('inv-modal').style.display = 'flex';
    }
    function closeInventory() {
        document.getElementById('inv-modal').style.display = 'none';
    }

    function switchTab(category, element) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if(element) element.classList.add('active');

        const grid = document.getElementById('inv-grid');
        grid.innerHTML = '';
        
        mobsData[category].forEach(mob => {
            const card = document.createElement('div');
            card.className = 'inv-card';
            card.onclick = () => selectMob(mob);
            
            const img = document.createElement('img');
            img.src = `mobs/${mob}.png`;
            img.alt = mob;
            img.onerror = function() { this.style.display = 'none'; };
            
            const nameLabel = document.createElement('span');
            nameLabel.className = 'inv-card-name';
            nameLabel.textContent = mob.replace('_', ' ');

            card.appendChild(img);
            card.appendChild(nameLabel);
            grid.appendChild(card);
        });
    }

    function selectMob(mob) {
        selectedMob = mob;
        const imgEl = document.getElementById('mob-preview-img');
        imgEl.src = `mobs/${mob}.png`;
        imgEl.style.display = 'block'; 
        
        document.getElementById('mob-name-display').textContent = mob.replace('_', ' ').toUpperCase();
        closeInventory();
        updateVisibility();
        generateCommand();
    }

    function switchItemTab(category, element) {
    const tabsContainer = document.getElementById('item-tabs');
    tabsContainer.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    
    if (element) {
        element.classList.add('active');
    }

    const grid = document.getElementById('items-grid');
    grid.innerHTML = '';
    
    const items = itemsData[category] || [];
    
    items.forEach(id => {
        if (id === "") {
            const emptySlot = document.createElement('div');
            emptySlot.className = 'item-slot';
            emptySlot.style.cursor = 'default';
            emptySlot.style.backgroundColor = 'transparent';
            emptySlot.style.borderColor = 'transparent';
            grid.appendChild(emptySlot);
            return;
        }

        const slot = document.createElement('div');
        slot.className = 'item-slot';
        slot.title = id; 
        slot.onclick = () => selectDropItem(id);
        
        const img = document.createElement('img');
        img.src = `items/${id}.png`;
        img.alt = id;
        img.onerror = function() { this.src = 'armors/empty.png'; };
        
        slot.appendChild(img);
        grid.appendChild(slot);
    });
}

    function openItemInventory(selectorElement) {
        activeDropRow = selectorElement.closest('.drop-row');
        document.getElementById('items-modal').style.display = 'flex';
    }

    function closeItemInventory() {
        document.getElementById('items-modal').style.display = 'none';
        activeDropRow = null;
    }

    function selectDropItem(itemId) {
        if (activeDropRow) {
            const selector = activeDropRow.querySelector('.drop-item-selector');
            selector.setAttribute('data-item-id', itemId);
            
            const img = selector.querySelector('img');
            
            img.src = `items/${itemId}.png`;
            img.onerror = function() { this.src = 'armors/empty.png'; };
            img.title = itemId; 
            
            generateCommand();
        }
        closeItemInventory();
    }

function addDrop() {
        const container = document.getElementById('drops-container');
        dropRowCounter++;
        
        const row = document.createElement('div');
        row.className = 'drop-row';
        row.id = 'drop-row-' + dropRowCounter;
        
        const selector = document.createElement('div');
        selector.className = 'drop-item-selector';
        selector.setAttribute('data-item-id', '');
        selector.onclick = function() { openItemInventory(this); };
        
        const selectorImg = document.createElement('img');
        selectorImg.src = 'armors/empty.png';
        selectorImg.title = "Haz clic para seleccionar ítem";
        
        selector.appendChild(selectorImg);
        
        const nameLabel = document.createElement('label');
        nameLabel.textContent = 'Name:';
        nameLabel.className = 'inline-label';
        nameLabel.style.margin = '0 10px 0 20px';
        
        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.className = 'drop-name';
        nameInput.placeholder = 'Custom Name';
        nameInput.style.flex = '1.5';
        nameInput.oninput = generateCommand;

        const qtyLabel = document.createElement('label');
        qtyLabel.textContent = 'Qty:';
        qtyLabel.className = 'inline-label';
        qtyLabel.style.margin = '0 10px';
        
        const qty = document.createElement('input');
        qty.type = 'number';
        qty.className = 'drop-qty';
        qty.value = 1;
        qty.min = 1;
        qty.style.width = '60px';
        qty.oninput = generateCommand;
        
        const removeBtn = document.createElement('button');
        removeBtn.textContent = 'X';
        removeBtn.className = 'mc-btn';
        removeBtn.style.padding = "6px 12px";
        removeBtn.onclick = () => { row.remove(); generateCommand(); };
        
        row.appendChild(selector);
        row.appendChild(nameLabel);
        row.appendChild(nameInput);
        row.appendChild(qtyLabel);
        row.appendChild(qty);
        row.appendChild(removeBtn);
        container.appendChild(row);
        
        openItemInventory(selector);
    }
    
    function updateVisibility() {
        const mob = selectedMob;
        const show = (id, condition, displayType = 'block') => {
            const element = document.getElementById(id);
            if (element) {
                element.style.display = condition ? displayType : 'none';
            }
        };

        show('group-holding', ['enderman', 'zombie_pigman'].includes(mob));
        show('group-armor', ['zombie', 'spawnskin'].includes(mob));
        show('group-aggro', mob === 'spawnskin');
        show('group-skin', mob === 'spawnskin');
        show('group-color', ['sheep', 'dog'].includes(mob));
        show('group-charged', mob === 'creeper', 'inline-flex');
        show('group-baby', ['chicken', 'sheep', 'rabbit', 'pig', 'wolf', 'cow', 'mooshroom', 'cowctus'].includes(mob), 'inline-flex');
        show('group-sheared', mob === 'sheep', 'inline-flex');
    }

    function toggleArmorInterface() {
        const isEnabled = document.getElementById('inp-armor-enable').checked;
        document.getElementById('armor-selectors').style.display = isEnabled ? 'flex' : 'none';
    }

    function toggleDropdown(triggerElement) {
        document.querySelectorAll('.custom-dropdown').forEach(dd => {
            if (dd !== triggerElement.parentElement) {
                dd.classList.remove('open');
            }
        });
        triggerElement.parentElement.classList.toggle('open');
    }

    function selectArmorOption(optionElement) {
        const value = optionElement.getAttribute('data-value');
        const dropdown = optionElement.closest('.custom-dropdown');
        const slotType = dropdown.getAttribute('data-slot');
        const trigger = dropdown.querySelector('.dropdown-trigger');
        const triggerImg = trigger.querySelector('img');
        const triggerText = trigger.querySelector('.dropdown-placeholder');

        armorState[slotType] = value;

        if (value === "") {
            triggerImg.style.display = 'none';
            triggerText.style.display = 'block';
        } else {
            const optionImg = optionElement.querySelector('img');
            if (optionImg) {
                triggerImg.src = optionImg.src;
                triggerImg.style.display = 'block';
                triggerText.style.display = 'none';
            }
        }

        dropdown.classList.remove('open');
        generateCommand();
    }

    function generateCommand() {
        let tags = [];
        
        const name = document.getElementById('inp-name').value.trim();
        if (name) tags.push(`name:"${name}"`);
        
        const health = document.getElementById('inp-health').value;
        if (health) tags.push(`health:${health}`);
        
        const defaultDrops = document.getElementById('inp-defaultDrops').checked;
        tags.push(`defaultDrops:${defaultDrops}`);
        
        const onFire = document.getElementById('inp-onFire').checked;
        if (onFire) tags.push(`onFire:true`);

        // Actualizar visual de fuego en la preview
        const fireLayer = document.getElementById('preview-layer-fire');
        if (fireLayer) fireLayer.style.display = onFire ? 'block' : 'none';
        
        if (['enderman', 'zombie_pigman'].includes(selectedMob)) {
            const holding = document.getElementById('inp-holding').value.trim();
            if (holding) tags.push(`holding:"${holding}"`);
        }
        
        // Actualizar armadura en el comando y en la preview
        const armorEnabled = document.getElementById('inp-armor-enable').checked && ['zombie', 'spawnskin'].includes(selectedMob);
        
        if (armorEnabled) {
            const formatArmor = (val) => val === "" ? "{}" : `"${val}"`;
            const h = formatArmor(armorState.helmet);
            const c = formatArmor(armorState.chestplate);
            const l = formatArmor(armorState.leggings);
            const b = formatArmor(armorState.boots);
            tags.push(`armor:[${h}, ${c}, ${l}, ${b}]`);
        }

        ['helmet', 'chestplate', 'leggings', 'boots'].forEach(part => {
            const layer = document.getElementById(`preview-layer-${part}`);
            if (layer) {
                if (armorEnabled && armorState[part] && armorState[part] !== "") {
                    layer.src = `armors/${armorState[part]}.png`;
                    layer.style.display = 'block';
                } else {
                    layer.style.display = 'none';
                }
            }
        });
        
        if (selectedMob === 'spawnskin') {
            const aggro = document.getElementById('inp-aggro').value;
            if (aggro) tags.push(`aggro:"${aggro}"`);
            const skin = document.getElementById('inp-skin').value;
            if (skin) tags.push(`skin:${skin}`);
        }
        
        if (selectedMob === 'creeper') {
            const charged = document.getElementById('inp-charged').checked;
            if (charged) tags.push(`charged:true`);
        }
        
        if (['chicken', 'sheep', 'rabbit', 'pig', 'wolf', 'cow', 'mooshroom', 'cowctus'].includes(selectedMob)) {
            const baby = document.getElementById('inp-baby').checked;
            if (baby) tags.push(`baby:true`);
        }
        
        if (['sheep', 'dog'].includes(selectedMob)) {
            const color = document.getElementById('inp-color').value;
            if (color) tags.push(`color:"${color}"`);
        }
        
        if (selectedMob === 'sheep') {
            const sheared = document.getElementById('inp-sheared').checked;
            if (sheared) tags.push(`sheared:true`);
        }
        
        const dropRows = document.querySelectorAll('.drop-row');
        if (dropRows.length > 0) {
            let dropsArray = [];
            dropRows.forEach(row => {
                const selector = row.querySelector('.drop-item-selector');
                const itemId = selector.getAttribute('data-item-id');
                const itemName = row.querySelector('.drop-name').value.trim();
                const qty = row.querySelector('.drop-qty').value || 1;
                
                if (itemId) {
                    if (itemName) {
                        dropsArray.push(`{item:{id:"${itemId}", name:"${itemName}"}, quantity:${qty}}`);
                    } else {
                        dropsArray.push(`{item:{id:"${itemId}"}, quantity:${qty}}`);
                    }
                }
            });
            if (dropsArray.length > 0) {
                tags.push(`drops:[${dropsArray.join(', ')}]`);
            }
        }
        
        let tagsString = tags.length > 0 ? ` {${tags.join(', ')}}` : '';
        let cmd = `/summon ${selectedMob} 1 ~ ~${tagsString}`;
        
        document.getElementById('output-command').textContent = cmd;
    }

    window.onload = init;
</script>

</body>
</html>
